nav_bridge_node:
  ros__parameters:
    # === 运动主机 (103) ===
    motion_host_ip: "192.168.1.103"
    motion_host_port: 43893
    charge_host_ip: "192.168.1.105"  # 自主充电目标IP
    charge_host_port: 3333           # 自主充电请求端口
    charge_config_port: 43899        # 速度源/导航模式配置端口
    charge_local_port: 49004         # 自主充电本地源端口
    local_recv_port: 43897           # 本地绑定端口, 用于接收103数据

    # === 定时器 ===
    heartbeat_interval_ms: 200       # 持有控制权期间的心跳周期 (ms)
    ros_heartbeat_topic: "/inspection_task_hub/heartbeat/nav_bridge" # ROS侧节点存活心跳
    ros_heartbeat_rate_hz: 1.0       # ROS侧节点存活心跳频率
    cmd_vel_rate_hz: 50              # 轴指令下发频率 (规格书要求50Hz)
    cmd_vel_timeout_ms: 5000         # /cmd_vel 速度输入保鲜时间, 超时后自动发零速度但不释放控制权 (ms)
    enable_charge_state_query: true      # 是否周期查询并发布/charge_manager_state
    charge_state_query_interval_ms: 1000 # 自主充电状态查询周期(ms)
    charge_state_query_timeout_ms: 1500  # 自主充电状态查询等待响应超时(ms)
    startup_acquire_control: true    # 节点启动后是否立即接管并持续发送 heartbeat
    stand_target_gait: 33            # /stand 最终目标步态: 32=L_WALK, 33=MOUNTAIN, 34=SILENT, 36=L_STAIR

    # === Frame IDs ===
    imu_frame_id: "imu_link"
    odom_frame_id: "odom"
    base_frame_id: "base_link"

    # === TF ===
    publish_tf: false                 # 是否发布 odom → base_link TF
